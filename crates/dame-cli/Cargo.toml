[package]
name = "dame-cli"
description = "Command-line front end for the dame draughts engine: Hub protocol and terminal play."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["games", "command-line-utilities"]

[[bin]]
name = "dame"
path = "src/main.rs"
# Same name as the engine crate: documenting both would write to the same
# `target/doc/dame/` and race (fails on Windows). The binary is a thin wrapper.
doc = false

[dependencies]
dame = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true
