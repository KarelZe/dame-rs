[package]
name = "dame"
description = "An international draughts (10x10 checkers) engine: bitboard move generation, search and evaluation."
readme = "README.md"
documentation = "https://docs.rs/dame"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# Keep the published crate to the Rust sources, README and license.
include = [
  "/src/**/*.rs",
  "/tests/**/*.rs",
  "/examples/**/*.rs",
  "/benches/**/*.rs",
  "/README.md",
  "/LICENSE",
]

[dependencies]

[dev-dependencies]
criterion = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "movegen"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "book"
harness = false
